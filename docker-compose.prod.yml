# Déploiement Coolify (Docker Compose) — voir docs/deployment.md.
# Domaines + HTTPS : attribués dans l'interface Coolify. TOUT le routage Traefik est géré par
# Coolify — AUCUN label ici. Seuls `web` et `docs` reçoivent un domaine public ; l'API est interne.
name: agenda

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL de l'API vue depuis le conteneur web (réseau Docker interne), figée au build.
        API_URL: http://api:4000
        # Site vitrine : « / » sans session y redirige (vide = page de connexion), cf. §15.
        SITE_URL: ${SITE_URL:-https://decouvrir.tandem-agenda.app}
    restart: unless-stopped
    environment:
      # Adresse affichée sur /privacy (politique de confidentialité).
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SITE_URL: ${SITE_URL:-https://decouvrir.tandem-agenda.app}
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    # Domaine : https://tandem-agenda.app (port 3000) — dans l'UI Coolify.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      # Origine PUBLIQUE du web (CORS, redirections OAuth).
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN est requis (ex. https://tandem-agenda.app)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenda}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY est requis}
      # Le navigateur ne voit que du HTTPS (Cloudflare/Traefik) : cookies Secure.
      COOKIE_SECURE: 'true'
      # IP réelle du client posée par Cloudflare (rate limiting par IP).
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-600}
      # Passer à false après l'inscription de Grace et Nicolas.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # File BullMQ de la synchronisation Google Calendar (déclencheur ; l'état vit en base).
      REDIS_URL: redis://redis:6379
      # Emails (mot de passe oublié) — SMTP générique, cf. docs/deployment.md §8.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Tandem <no-reply@tandem-agenda.app>}
      # Pied des e-mails : lien d'aide et adresse de contact (celle de la page de confidentialité).
      DOCS_URL: ${DOCS_URL:-https://docs.tandem-agenda.app}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Notifications instantanées Android (compte de service Firebase, JSON ou base64) — docs/android.md.
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # Page d'administration : adresses e-mail séparées par des virgules.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Surveillance : jeton de GET /metrics (Prometheus), cf. docs/monitoring.md.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Notifications du site (Web Push) : clés VAPID, cf. docs/deployment.md §4.3.
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      # App Android : release GitHub relayée par l'API (jeton lecture seule si dépôt privé).
      ANDROID_RELEASE_REPO: ${ANDROID_RELEASE_REPO:-fs0ciety7000/agenda}
      GITHUB_RELEASES_TOKEN: ${GITHUB_RELEASES_TOKEN:-}
      # Tâches par e-mail (réception par Resend) — docs/email-to-task.md.
      INBOUND_EMAIL_ADDRESS: ${INBOUND_EMAIL_ADDRESS:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Interne uniquement — pas de domaine (le web la proxifie sous /v1/*).

  # Site de documentation (guide, technique, RGPD, référence de l’API) — docs/deployment.md §13.
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        DOCS_URL: ${DOCS_URL:-https://docs.tandem-agenda.app}
        APP_URL: ${WEB_ORIGIN:-https://tandem-agenda.app}
    restart: unless-stopped
    expose:
      - '80'
    # Domaine : https://docs.tandem-agenda.app (port 80) — dans l'UI Coolify.

  # Site vitrine (présentation de l’app, pages statiques) — docs/deployment.md §15.
  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://decouvrir.tandem-agenda.app}
        APP_URL: ${WEB_ORIGIN:-https://tandem-agenda.app}
        DOCS_URL: ${DOCS_URL:-https://docs.tandem-agenda.app}
        PLAY_URL: ${PLAY_URL:-}
        CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    restart: unless-stopped
    expose:
      - '80'
    # Domaine : https://decouvrir.tandem-agenda.app (port 80) — dans l'UI Coolify.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
    expose:
      - '5432'
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agenda} -d ${POSTGRES_DB:-agenda}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Interne uniquement — jamais exposé publiquement.

  # Sauvegarde chaque nuit, RESTAURÉE dans une base temporaire pour vérification, copiée hors
  # serveur si configuré (docs/deployment.md §6). Unhealthy si aucune sauvegarde réussie < 26 h.
  backup:
    build:
      context: infra/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-agenda}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-agenda}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Copie hors serveur (rclone) : ex. Cloudflare R2 → BACKUP_OFFSITE_REMOTE=offsite:agenda-backups
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      # Moniteur « Push » d'Uptime Kuma (ou Healthchecks.io) prévenu après chaque sauvegarde.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
    volumes:
      - agenda_postgres_backups:/backups
    depends_on:
      # L'API applique les migrations au démarrage : on attend un schéma complet.
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /backups/last-success -mmin -1560 2>/dev/null)"']
      interval: 10m
      timeout: 10s
      start_period: 10m
      retries: 1
    # Interne uniquement.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF : les jobs planifiés survivent à un redémarrage (perdre la file n'est de toute façon
    # pas grave : le balayage périodique rattrape tout depuis la base).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    expose:
      - '6379'
    volumes:
      - agenda_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    # Interne uniquement — jamais exposé publiquement.

volumes:
  agenda_postgres_data:
  agenda_postgres_backups:
  agenda_redis_data:
