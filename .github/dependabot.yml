# Mises à jour des dépendances (docs/deployment.md §10).
# Hebdomadaire, groupées pour limiter le bruit : un PR « correctifs » (patch + minor) par
# écosystème ; les versions majeures arrivent chacune dans leur PR (montées dédiées, risque R7).
# Les alertes de sécurité (Dependabot security updates) ouvrent un PR immédiatement.
# Ignorées (montées manuelles, décidées) : les versions majeures qui demandent une migration
# coordonnée — cf. docs/deployment.md §10.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (apps/*, packages/*)
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Brussels }
    open-pull-requests-limit: 5
    groups:
      correctifs:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm # site de documentation (npm, hors workspace pnpm)
    directory: /apps/docs
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Brussels }
    open-pull-requests-limit: 3
    groups:
      correctifs:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: gradle # app Android
    directory: /apps/android
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Brussels }
    open-pull-requests-limit: 5
    groups:
      correctifs:
        update-types: [minor, patch]
    ignore:
      # Retrofit 3 repose sur OkHttp 4 ; OkHttp 5 change aussi MockWebServer (tests).
      - dependency-name: 'com.squareup.okhttp3:*'
        update-types: [version-update:semver-major]
    labels: [dependencies, android]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/docs, /infra/backup]
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Brussels }
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # La sauvegarde (pg_dump) doit rester à la version du serveur PostgreSQL du compose :
      # un pg_dump plus récent produit des dumps que l'ancien serveur ne sait pas restaurer.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # Node : uniquement des versions LTS, montées à la main (API + web ensemble).
      - dependency-name: node
        update-types: [version-update:semver-major]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
