# Tests Android sur un vrai émulateur (SQLite, Keystore, FileProvider, lancement de l'app) : ce que
# Robolectric ne couvre pas. Lancé quand l'app Android change, pour ne pas ralentir le reste.
name: Android (émulateur)

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Tests instrumentés (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Accélération matérielle de l'émulateur sur les runners Linux de GitHub.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compiler l'app et les tests
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-reports
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
