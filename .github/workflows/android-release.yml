name: Android — APK à installer

# À chaque mise à jour de l'app Android sur main (apps/android/**), l'APK et version.json sont publiés dans la release `android-latest`.
# L'app et le site les lisent via l'API (relais /v1/app/android/*), dépôt public ou privé.
# Secrets requis (Settings → Secrets and variables → Actions) : ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD — cf. docs/android.md §4. Sans eux, rien n'est publié.
# Google Play (facultatif, docs/play-store.md) : l'AAB est joint à la release ; avec le secret
# PLAY_SERVICE_ACCOUNT_JSON, il est aussi envoyé en « Test interne ».
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      API_BASE_URL: ${{ vars.AGENDA_API_BASE_URL || 'https://agenda.fs0ciety.org/' }}
      RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/android-latest
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - name: Clé de signature (secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 absent : voir docs/android.md §4."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agenda.jks"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Vérifier la configuration Firebase (facultative)
        env:
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
        run: |
          # Tout vide = notifications instantanées désactivées (normal). Sinon, les 4 valeurs doivent
          # être celles de google-services.json (docs/android.md §4.1), pas les chemins du tableau.
          if [ -z "$FCM_APP_ID$FCM_API_KEY$FCM_PROJECT_ID$FCM_SENDER_ID" ]; then
            echo "Firebase non configuré : notifications instantanées désactivées."; exit 0
          fi
          ok=true
          [[ "$FCM_APP_ID" =~ ^1:[0-9]+:android:[0-9a-f]+$ ]] || { echo "::error::FCM_APP_ID doit ressembler à 1:123456789012:android:0a1b2c3d4e5f…"; ok=false; }
          [[ "$FCM_API_KEY" =~ ^AIza[0-9A-Za-z_-]{35}$ ]] || { echo "::error::FCM_API_KEY doit ressembler à AIza… (39 caractères)"; ok=false; }
          [[ "$FCM_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,29}$ ]] || { echo "::error::FCM_PROJECT_ID doit ressembler à agenda-gn"; ok=false; }
          [[ "$FCM_SENDER_ID" =~ ^[0-9]+$ ]] || { echo "::error::FCM_SENDER_ID doit être un nombre (project_number)"; ok=false; }
          [[ "$FCM_APP_ID" == "1:$FCM_SENDER_ID:"* ]] || { echo "::error::FCM_APP_ID et FCM_SENDER_ID ne viennent pas du même projet"; ok=false; }
          $ok
      - name: Construire l'APK (production) et l'AAB (Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Notifications instantanées (facultatif, docs/android.md) : variables du dépôt (identifiants
          # publics du projet Firebase, pas des secrets). Absentes = relève périodique seulement.
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
        run: |
          # Numéro de version strictement croissant (condition des mises à jour Android).
          code=$((GITHUB_RUN_NUMBER + 10))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.3.$code" >> "$GITHUB_ENV"
          # assembleRelease : APK installé depuis le site (mise à jour automatique).
          # bundlePlay : AAB pour Google Play (sans mise à jour automatique ni permission d'installer).
          ./gradlew assembleRelease bundlePlay --console=plain \
            -Pagenda.apiBaseUrl="$API_BASE_URL" \
            -Pagenda.versionCode="$code" -Pagenda.versionName="0.3.$code" \
            -Pagenda.updateUrl="${API_BASE_URL}v1/app/android/version.json" \
            -Pagenda.fcm.appId="$FCM_APP_ID" -Pagenda.fcm.apiKey="$FCM_API_KEY" \
            -Pagenda.fcm.projectId="$FCM_PROJECT_ID" -Pagenda.fcm.senderId="$FCM_SENDER_ID" \
            -Pagenda.keystore="$RUNNER_TEMP/agenda.jks" -Pagenda.keyAlias=agenda \
            -Pagenda.keystorePassword="$KEYSTORE_PASSWORD" -Pagenda.keyPassword="$KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/agenda.jks"
      - name: Publier (remplace la version précédente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk agenda-gn.apk
          cp app/build/outputs/bundle/play/app-play.aab agenda-gn-play.aab
          sha=$(sha256sum agenda-gn.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s/agenda-gn.apk","sha256":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$RELEASE_BASE" "$sha" > version.json
          cat version.json
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest agenda-gn.apk version.json agenda-gn-play.aab \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android — dernière version ($VERSION_NAME)" \
            --notes "Application Android de Tandem, connectée à $API_BASE_URL.

          **Première installation** : sur le téléphone, ouvrir cette page, toucher **agenda-gn.apk**, puis *Installer* (autoriser Chrome à « installer des applications inconnues » la première fois).

          **Mises à jour** : l'app les propose d'elle-même (notification + bandeau « Nouvelle version disponible »).

          **Google Play** : \`agenda-gn-play.aab\` est la version à envoyer dans la Play Console (docs/play-store.md).

          Version $VERSION_NAME · commit ${GITHUB_SHA::7}"
      - name: Notes de version pour Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p whatsnew
          cp fastlane/metadata/android/fr-FR/changelogs/default.txt whatsnew/whatsnew-fr-FR
          cp fastlane/metadata/android/en-US/changelogs/default.txt whatsnew/whatsnew-en-US
      - name: Envoyer sur Google Play (test interne)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: be.agendagn.app
          releaseFiles: apps/android/agenda-gn-play.aab
          track: internal
          status: completed
          whatsNewDirectory: apps/android/whatsnew
          mappingFile: apps/android/app/build/outputs/mapping/play/mapping.txt
