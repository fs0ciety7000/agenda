name: Android — APK à installer

# À chaque mise à jour de main, l'APK est publié à une adresse fixe :
# https://github.com/<dépôt>/releases/tag/android-latest  (fichier agenda-gn.apk)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire l'APK (production, clé de recette)
        run: >-
          ./gradlew assembleRelease --console=plain -Pagenda.recette
          -Pagenda.apiBaseUrl=${{ vars.AGENDA_API_BASE_URL || 'https://agenda.fs0ciety.org/' }}
      - name: Publier (remplace la version précédente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk agenda-gn.apk
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest agenda-gn.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android — dernière version ($version)" \
            --notes "Application Android d'Agenda G & N, connectée à ${{ vars.AGENDA_API_BASE_URL || 'https://agenda.fs0ciety.org/' }}.

          **Installer / mettre à jour** : sur le téléphone, ouvrir cette page (connecté à GitHub), toucher **agenda-gn.apk**, puis *Installer*. La première fois, autoriser le navigateur à « installer des applications inconnues ».

          Version $version · commit ${GITHUB_SHA::7}"
