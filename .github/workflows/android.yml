# App Android : lint, tests (JVM + Robolectric), APK debug et build release (R8).
# Seulement quand l'app Android change (minutes GitHub Actions comptées sur un dépôt privé).
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    # « labeled » : l'étiquette « captures » relance le job avec les captures d'écran.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  # À la demande (Run workflow) : mêmes vérifications, plus les captures d'écran.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (lint · tests · APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
      # Build release (R8) vérifié ; l'APK signé et publié vient d'android-release.yml.
      - run: ./gradlew assembleRelease bundlePlay --console=plain -Ptandem.apiBaseUrl=https://agenda.example.invalid/
      # Captures Roborazzi (docs/screenshots/android), à relire avant une publication : à la
      # demande, ou avec l'étiquette « captures » sur la PR. Récupérées dans l'artefact.
      - name: Captures d'écran
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'captures')
        run: ./gradlew testDebugUnitTest -Pscreenshots --console=plain
      - name: Envoyer les captures
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'captures')
        uses: actions/upload-artifact@v7
        with:
          name: android-captures
          path: |
            docs/screenshots/android
            apps/android/fastlane/metadata/android/*/images/phoneScreenshots
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: apps/android/app/build/reports
