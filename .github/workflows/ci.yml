name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint · Typecheck · Tests · Build (API + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Couverture du moteur métier (≥ 95 %)
        run: pnpm --filter @agenda/domain coverage
      - run: pnpm build

  e2e:
    name: E2E web (Playwright)
    runs-on: ubuntu-latest
    needs: js
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NODE_ENV: production
      AUTH_RATE_LIMIT: '100'
      API_URL: http://localhost:4000
      INBOUND_EMAIL_ADDRESS: 'agenda+{token}@example.test'
      INBOUND_EMAIL_SECRET: ci-inbound-secret-ci-inbound-secret-1234
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @agenda/api db:deploy
      - run: pnpm --filter @agenda/web exec playwright install --with-deps chromium
      - name: Start API & web
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http-get://localhost:4000/health/ready http-get://localhost:3000/login
      - run: pnpm --filter @agenda/web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/test-results
            api.log
            web.log

  docker:
    name: Images Docker (compose de production)
    runs-on: ubuntu-latest
    needs: js
    timeout-minutes: 20
    env:
      # Valeurs factices : seule la construction des images est vérifiée ici.
      WEB_ORIGIN: https://agenda.example.test
      POSTGRES_PASSWORD: ci
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml build
      # L'image web sert-elle bien ses fichiers statiques (logo, icônes) et ses pages ?
      # Sauvegarde réelle : API (migrations) + backup, qui doit restaurer son dump avec succès.
      - name: Vérifier la sauvegarde et sa restauration
        run: |
          docker compose -f docker-compose.prod.yml up -d backup
          for i in $(seq 1 60); do
            docker compose -f docker-compose.prod.yml logs backup | grep -q 'restauration vérifiée' && break
            sleep 3
          done
          docker compose -f docker-compose.prod.yml logs backup
          docker compose -f docker-compose.prod.yml logs backup | grep -q 'restauration vérifiée'
          docker compose -f docker-compose.prod.yml exec -T backup test -s /backups/last-success
          docker compose -f docker-compose.prod.yml down -v
      - name: Vérifier l'image web (sans API)
        run: |
          docker run -d --name web-smoke -p 3000:3000 agenda-web
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          for path in /login /icons/icon-192.png /icon.png /apple-icon.png /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path → $code"
            test "$code" = 200
          done

  android:
    name: Android (lint · tests · APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
      # Build release (R8) vérifié ; l'APK signé et publié vient d'android-release.yml.
      - run: ./gradlew assembleRelease bundlePlay --console=plain -Pagenda.apiBaseUrl=https://agenda.example.invalid/
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: apps/android/app/build/reports
