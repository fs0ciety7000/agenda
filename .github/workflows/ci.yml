name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint · Typecheck · Tests · Build (API + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda?schema=public
      TEST_DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda_test?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E web (Playwright)
    runs-on: ubuntu-latest
    needs: js
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NODE_ENV: production
      AUTH_RATE_LIMIT: '100'
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @agenda/api db:deploy
      - run: pnpm --filter @agenda/web exec playwright install --with-deps chromium
      - name: Start API & web
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http-get://localhost:4000/health/ready http-get://localhost:3000/login
      - run: pnpm --filter @agenda/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/test-results
            api.log
            web.log

  android:
    name: Android (lint · tests · APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
