# Première visite de l'accueil : navigateur néerlandophone → /nl/, ni français ni néerlandais → /en/.
# Le sélecteur de langue du site pose le cookie « lang », qui l'emporte ensuite.
map $http_accept_language $browser_lang {
  default en;
  "" fr;
  "~*^fr" fr;
  "~*^nl" nl;
}
map "$cookie_lang:$browser_lang" $home_redirect {
  default "";
  ":en" /en/;
  ":nl" /nl/;
  "~^en:" /en/;
  "~^nl:" /nl/;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Traefik (Coolify) et Cloudflare sont devant : pas de redirection absolue vers :80.
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fichiers versionnés par Next.js (nom contenant une empreinte) : cache long.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = / {
    add_header Vary "Accept-Language, Cookie" always;
    if ($home_redirect) {
      return 302 $home_redirect;
    }
    try_files /index.html =404;
  }

  location ~* \.(webp|png|jpg|ico|mp4|webm)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
